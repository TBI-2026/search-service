services:
  search-service:
    build: .
    container_name: search-service
    env_file: .env
    ports:
      - "8001:8001"
    networks:
      - internal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  internal-network:
    external: true
